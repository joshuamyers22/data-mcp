# Raw analytical control: same source permissions, no promoted ontology loaded.
access_mode = "analysis"
max_rows = 500
max_result_bytes = 262144
query_timeout_seconds = 30

[files.raw]
path = "/absolute/path/to/data"
writable = false
formats = ["parquet", "csv", "tsv", "json"]

[postgres.local]
dsn_env = "ANA_LOCAL_READ_DSN"
writable = false
sslmode = "disable"

# Add a cloud source with sslmode="verify-full" when the reviewed source needs it.
