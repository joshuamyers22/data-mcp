# This is a separate analytical launch profile. The normal example stays read/write.
access_mode = "analysis"
ontology_file = "/absolute/path/to/data-mcp/ontology/manifest.example.toml"
max_rows = 500
max_result_bytes = 262144
query_timeout_seconds = 30

[files.raw]
path = "/absolute/path/to/data"
writable = false
formats = ["parquet", "csv", "tsv", "json"]

[postgres.local]
dsn_env = "ANA_LOCAL_READ_DSN"
writable = false
sslmode = "disable"

# Add a cloud source with sslmode="verify-full" when a metric needs it.
