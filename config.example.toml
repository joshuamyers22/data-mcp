max_rows = 500
max_result_bytes = 262144
max_write_bytes = 1048576
max_files = 10000
max_download_bytes = 268435456
max_rewrite_bytes = 268435456
query_timeout_seconds = 30

[files.local]
path = "/absolute/path/to/data"
writable = false
formats = ["parquet", "csv", "tsv", "json"]

[postgres.analytics]
dsn_env = "DATA_MCP_POSTGRES_DSN"
writable = false
sslmode = "verify-full"

[mysql.warehouse]
dsn_env = "DATA_MCP_MYSQL_DSN"
writable = false
tls = true

[mongodb.documents]
uri_env = "DATA_MCP_MONGODB_URI"
database = "analytics"
writable = false
tls = true

[s3.lake]
bucket = "example-data-bucket"
prefix = "datasets"
region = "us-east-1"
writable = false
formats = ["parquet", "csv", "json"]
